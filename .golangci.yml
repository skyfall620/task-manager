version: "2"

linters:
  default: standard
  enable:
    - whitespace
    - wsl_v5
    - errorlint
    - nilerr
    - sqlclosecheck
    - rowserrcheck
    - funlen
    - gocognit

  settings:
    wsl_v5:
      default: none
      enable:
        - err
        - after-block
    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 21
  
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - funlen
          - gocognit

formatters:
  enable:
    - gofmt